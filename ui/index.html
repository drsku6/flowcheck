<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0891b2">
<meta name="description" content="flowcheck — every lesson as a trustworthy chart. Every bullet backed by a source quote.">
<title>flowcheck</title>
<script>
(function () {
  var saved = null;
  try { saved = localStorage.getItem("flowcheck-theme"); } catch (e) {}
  var mq = window.matchMedia("(prefers-color-scheme: dark)");
  var apply = function () {
    document.documentElement.dataset.theme =
      saved === "light" || saved === "dark" ? saved : (mq.matches ? "dark" : "light");
  };
  apply();
  mq.addEventListener("change", function () { if (!saved) apply(); });
  window.__setTheme = function (v) {
    saved = v;
    try { v ? localStorage.setItem("flowcheck-theme", v) : localStorage.removeItem("flowcheck-theme"); } catch (e) {}
    apply();
  };
})();
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
